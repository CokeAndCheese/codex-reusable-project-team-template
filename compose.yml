services:
  web:
    build:
      context: .
    image: codex-reusable-project-team-template:local
    container_name: codex-reusable-project-team-template
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -qx ok"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web

networks:
  web:
    external: true

